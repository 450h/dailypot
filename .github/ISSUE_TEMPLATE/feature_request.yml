name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints (see CLAUDE.md and docs/decisions)
      options:
        - label: This works fully offline (no network access, ADR-0005), or I explain why a superseding ADR is justified
        - label: It doesn't require storing money as decimals/floats (ADR-0003)
