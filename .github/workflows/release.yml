name: Release

# Releases are built only here, from a v* tag (CLAUDE.md golden rule 9).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run dist
      - name: SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File -Filter *.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $files = @(Get-ChildItem dist -File -Filter *.exe | ForEach-Object { $_.FullName }) + 'dist/SHA256SUMS.txt'
          # Release body: docs/releases/<tag>.md after its first "---" line (the part above it is maintainer notes);
          # a tag without a notes file falls back to GitHub's generated notes.
          $notes = "docs/releases/$tag.md"
          if (Test-Path $notes) {
            $lines = @(Get-Content $notes -Encoding utf8)
            $cut = [Array]::IndexOf(@($lines | ForEach-Object { $_.Trim() }), '---')
            $body = ($lines | Select-Object -Skip ($cut + 1)) -join "`n"
            Set-Content -Path release-body.md -Value $body.Trim() -Encoding utf8
            gh release create $tag @files --title "DailyPot $tag" --notes-file release-body.md --latest
          } else {
            gh release create $tag @files --title "DailyPot $tag" --generate-notes --latest
          }
